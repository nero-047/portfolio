<!doctype html>
<meta charset="utf-8">
<title>Social card source — 1200×630</title>
<!--
  Source for public/images/social/card.png (Open Graph / Twitter, 1200×630).
  Rendered once with headless Chrome — not part of the build, so the site has no
  browser dependency. Regenerate after changing this file:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --default-background-color=00000000 \
      --screenshot=public/images/social/card.png \
      --allow-file-access-from-files scripts/og-card/card.html

  The car is the real F1-75 poster asset. The offsets below are the same measured
  alpha-bbox numbers used by .hero__poster in app/assets/css/main.css, so the card
  frames the car exactly as the site does.
-->
<style>
  :root { --bg:#f3f0e9; --fg:#151513; --muted:#686660; --rule:#d5d0c7; --accent:#c52727; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg); color: var(--fg); overflow: hidden;
    font: 400 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 1fr 1fr; align-items: center;
    padding: 64px 72px;
  }
  .text { position: relative; z-index: 2; }
  .wordmark { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
  .wordmark span { color: var(--accent); }
  .eyebrow {
    margin-top: 40px; font: 500 15px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }
  h1 { margin-top: 18px; font-size: 62px; font-weight: 600; letter-spacing: -0.045em; line-height: 0.99; }
  h1 em { font-style: normal; color: var(--muted); }
  .foot {
    position: absolute; left: 72px; bottom: 56px; display: flex; gap: 20px; align-items: center;
    font: 500 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted);
  }
  .foot i { display: block; width: 44px; height: 1px; background: var(--rule); font-style: normal; }

  /* Car frame: box === car silhouette (see comment above). */
  .stage { position: relative; width: 560px; aspect-ratio: 952 / 526; justify-self: end; margin-right: -24px; }
  .stage::after {
    content: ""; position: absolute; left: 13%; right: 17%; bottom: 1%; height: 13%; z-index: -1;
    background: radial-gradient(ellipse at center, rgba(21,20,19,0.13) 0%, transparent 70%);
  }
  .stage img { position: absolute; left: -22.48%; top: -43.83%; width: 158.01%; height: auto; max-width: none; }
</style>
<div class="text">
  <p class="wordmark">nero<span>.</span></p>
  <p class="eyebrow">Rishi Gurung / Software Engineer</p>
  <h1>I build software<br><em>that has to work.</em></h1>
</div>
<div class="stage"><img src="../../public/images/social/f1-75-poster.png" alt=""></div>
<p class="foot">nero.is-a.dev <i></i> Backend · Web · Mobile</p>
