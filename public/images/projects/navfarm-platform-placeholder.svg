<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
  <defs>
    <linearGradient id="farm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3c4"/>
      <stop offset="1" stop-color="#a9c98f"/>
    </linearGradient>
    <linearGradient id="farm-row-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f8f4a"/>
      <stop offset="1" stop-color="#5a7a3c"/>
    </linearGradient>
    <linearGradient id="farm-row-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ea85f"/>
      <stop offset="1" stop-color="#78964e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="720" fill="url(#farm-sky)"/>

  <!-- striped fields, slight perspective -->
  <g>
    <polygon points="-40,720 -40,120 960,60 960,720" fill="#d8c79a"/>
    <g>
      <polygon points="-40,690 -40,150 100,140 60,690" fill="url(#farm-row-a)"/>
      <polygon points="60,690 100,140 230,132 210,690" fill="url(#farm-row-b)"/>
      <polygon points="210,690 230,132 360,124 360,690" fill="url(#farm-row-a)"/>
      <polygon points="360,690 360,124 490,118 510,690" fill="url(#farm-row-b)"/>
      <polygon points="510,690 490,118 620,112 660,690" fill="url(#farm-row-a)"/>
      <polygon points="660,690 620,112 750,106 810,690" fill="url(#farm-row-b)"/>
      <polygon points="810,690 750,106 880,100 970,690" fill="url(#farm-row-a)"/>
    </g>
  </g>

  <!-- silo + barn cluster -->
  <g transform="translate(140,300)">
    <rect x="0" y="40" width="46" height="90" rx="4" fill="#e7ddc8" stroke="#b9ab86"/>
    <ellipse cx="23" cy="40" rx="23" ry="10" fill="#f2eadb" stroke="#b9ab86"/>
    <rect x="60" y="70" width="70" height="60" fill="#8a5a3f"/>
    <polygon points="55,70 95,36 135,70" fill="#5f3a26"/>
  </g>

  <!-- sun -->
  <circle cx="840" cy="90" r="34" fill="#f6e7ab" opacity="0.9"/>

  <!-- caption card -->
  <g transform="translate(40,40)">
    <rect width="330" height="86" rx="8" fill="#151710" opacity="0.72"/>
    <text x="20" y="30" fill="#c9d8b6" font-family="ui-monospace,Menlo,monospace" font-size="10" letter-spacing="1.5">NAVFARM PLATFORM</text>
    <text x="20" y="58" fill="#f4f1e6" font-family="system-ui,sans-serif" font-size="20" font-weight="600">Smarter tools for</text>
    <text x="20" y="80" fill="#f4f1e6" font-family="system-ui,sans-serif" font-size="20" font-weight="600">a stronger tomorrow</text>
  </g>
</svg>
